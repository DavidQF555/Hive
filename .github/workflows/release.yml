name: Build and upload mod
on:
  release:
    types: [ published ]
    branches: [ neoforge-1.21.4 ]

jobs:

  path:
    name: Generate file path
    runs-on: ubuntu-latest
    outputs:
      file_path: ${{steps.file.outputs.file_path}}
    steps:
      - name: Generate file path
        id: file
        run: echo "file_path=./build/libs/hive-$(echo ${{github.event.release.tag_name}} | cut -dv -f2).jar" >> $GITHUB_OUTPUT
  build:
    name: Build and cache
    runs-on: ubuntu-latest
    needs: [ path ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'adopt'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Generate data
        run: ./gradlew :runServerData
      - name: Build
        run: ./gradlew :build
      - name: Cache
        uses: actions/cache@v5
        with:
          path: ${{needs.path.outputs.file_path}}
          key: ${{github.sha}}

  upload:
    name: Upload
    runs-on: ubuntu-latest
    needs: [ path,build ]
    steps:
      - name: Calculate Modrinth version
        id: calculate_modrinth_version
        run: echo "modrinth_version=$(echo ${{github.event.release.tag_name}} | cut -d '-' -f2)" >> $GITHUB_OUTPUT
      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: ${{needs.path.outputs.file_path}}
          key: ${{github.sha}}
      - name: Upload to GitHub release, CurseForge, and Modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          files: ${{needs.path.outputs.file_path}}
          name: ${{github.event.release.name}}
          version: ${{github.event.release.tag_name}}
          version-type: beta
          changelog: ${{github.event.release.body}}
          loaders: neoforge
          game-versions: 1.21.4
          java: 21
          modrinth-version: ${{steps.calculate_modrinth_version.outputs.modrinth_version}}
          modrinth-id: ypXGbbhR
          modrinth-token: ${{secrets.modrinth_token}}
          curseforge-id: 1213320
          curseforge-token: ${{secrets.curseforge_token}}
          github-tag: ${{github.event.release.tag_name}}
          github-token: ${{secrets.token_github}}